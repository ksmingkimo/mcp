<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP MCP 调试面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ERP MCP 调试面板</h1>
    <div id="connStatus" class="conn-pending">正在连接服务器…</div>
  </header>

  <main>
    <!-- 左：工具列表（来自 tools/list） -->
    <aside id="toolList">
      <p class="hint">工具加载中…</p>
    </aside>

    <!-- 右：选中工具的参数表单 + 调用 + 结果 -->
    <section id="detail">
      <div id="toolInfo"><p class="hint">从左侧选择一个工具</p></div>
      <form id="paramForm"></form>
      <button id="callBtn" disabled>调用</button>
      <div id="result"></div>
    </section>
  </main>

  <script src="mcp-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
